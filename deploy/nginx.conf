# ---------------------------------------------------------------------------
# Samay ka nginx config  (server pe ye file /etc/nginx/sites-available/samay banti hai)
#
#   browser ──> nginx ──┬──>  /api/...   => Laravel (PHP-FPM)      [api/public/index.php]
#                       └──>  baaki sab  => Vue ki bani hui files   [web/dist]
#
# Check:  sudo nginx -t        Reload:  sudo systemctl reload nginx
# ---------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Domain lene ke baad "_" ki jagah apna domain likho, jaise:  server_name samay.example.in;
    server_name _;

    root /var/www/samay/web/dist;
    index index.html;
    client_max_body_size 2m;

    # Thode se security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1) API: har /api/... request Laravel ke index.php ko jaati hai.
    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/samay/api/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/samay/api/public;
        # setup-server.sh yahan ka "php8.3" apne aap server ke PHP version se badal deta hai.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    # 2) Vite ki files ke naam mein hash hota hai (index-AbC123.js), isliye browser inhe 1 saal tak yaad rakh sakta hai.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 3) Vue SPA: file mile to wahi do, warna index.html (phir Vue Router page dikhata hai).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .env, .git jaisi chhupi files kabhi mat dikhao
    location ~ /\.(?!well-known) {
        deny all;
    }
}
